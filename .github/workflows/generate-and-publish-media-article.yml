name: Generate and publish SOAM Media article

on:
  schedule:
    # UTC: JST 07:02 / 12:02 / 20:02. Avoid the top-of-hour scheduler concentration.
    - cron: "2 22 * * *"
    - cron: "2 3 * * *"
    - cron: "2 11 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "公開枠（auto は現在時刻から選択）"
        required: false
        type: choice
        default: auto
        options: [auto, morning, noon, evening]
      dry_run:
        description: "生成・検証のみ（commit/pushなし）"
        required: false
        default: false
        type: boolean
      list_models_only:
        description: "OpenAI利用可能モデルの確認だけを実行する"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: soam-media-generation
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare deployment credentials
        if: ${{ !inputs.dry_run && !inputs.list_models_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required before article generation starts."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required before article generation starts."; exit 1; }
      - name: List available OpenAI candidate models
        if: ${{ inputs.list_models_only }}
        env:
          MEDIA_AI_BASE_URL: ${{ secrets.MEDIA_AI_BASE_URL }}
          MEDIA_AI_API_KEY: ${{ secrets.MEDIA_AI_API_KEY }}
        run: node scripts/generate-media-article.mjs --list-openai-models
      - name: Generate, validate, and publish one article
        if: ${{ !inputs.list_models_only }}
        env:
          MEDIA_AI_BASE_URL: ${{ secrets.MEDIA_AI_BASE_URL }}
          MEDIA_AI_API_KEY: ${{ secrets.MEDIA_AI_API_KEY }}
          MEDIA_AI_MODEL: ${{ secrets.MEDIA_AI_MODEL }}
        run: |
          SLOT="${{ inputs.slot != 'auto' && inputs.slot || (github.event.schedule == '2 22 * * *' && 'morning') || (github.event.schedule == '2 3 * * *' && 'noon') || 'evening' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/generate-media-article.mjs --dry-run --slot="$SLOT"
          else
            node scripts/generate-media-article.mjs --slot="$SLOT"
          fi
      - name: Upload dry-run preview
        if: ${{ inputs.dry_run && !inputs.list_models_only && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: soam-media-article-dry-run-preview
          path: |
            automation/dry-run-output/*.html
            automation/dry-run-output/*-generation-summary.json
          retention-days: 7
      - name: Normalize SEO metadata
        if: ${{ !inputs.dry_run && !inputs.list_models_only }}
        run: |
          node scripts/normalize-soam-link-urls.mjs
          node scripts/apply-media-seo.mjs
      - name: Refresh sitemap and verify all published articles
        if: ${{ !inputs.dry_run && !inputs.list_models_only }}
        run: |
          node scripts/generate-sitemap.mjs
          node scripts/test-site-links.mjs
          node scripts/test-media-seo.mjs
          node scripts/test-publish-scheduled-articles.mjs
          node scripts/test-media-generation.mjs
          node scripts/test-media-strategy.mjs
      - name: Commit and push a complete article publication
        if: ${{ !inputs.dry_run && !inputs.list_models_only }}
        run: |
          if git diff --quiet; then
            echo "No new article was generated."
            exit 0
          fi
          TITLE="$(node -e "const q=require('./automation/article-queue.json');const a=q.articles.filter(x=>x.generated).at(-1).article;process.stdout.write('content: publish '+a.slug+' '+a.title.slice(0,60))")"
          git config user.name "SOAM CREATIVE Publisher"
          git config user.email "soam.creative.media@gmail.com"
          git add articles automation index.html sitemap.xml pillars guides media-home.js media-strategy.css docs/ARTICLE_AUDIT_20260801.csv docs/ARTICLE_AUDIT_20260801.md
          git commit -m "$TITLE"
          git pull --rebase origin main
          node scripts/test-media-seo.mjs
          git push origin HEAD:main
          ARTICLE_FILE="$(git show --format= --name-only HEAD | sed -n 's#^articles/\(article-[0-9][0-9]*\.html\)$#\1#p' | head -1)"
          if [ -z "$ARTICLE_FILE" ]; then
            echo "Generated article file could not be identified after commit."
            exit 1
          fi
      - name: Build Cloudflare Pages artifact
        if: ${{ !inputs.dry_run && !inputs.list_models_only }}
        run: node scripts/build-pages-site.mjs
      - name: Deploy to Cloudflare Pages
        if: ${{ !inputs.dry_run && !inputs.list_models_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.105.0 pages deploy dist/site --project-name soam-creative-media --branch main
      - name: Verify custom-domain article publication
        if: ${{ !inputs.dry_run && !inputs.list_models_only }}
        run: |
          ARTICLE_FILE="$(node -e "const q=require('./automation/article-queue.json');const a=q.articles.filter(x=>x.generated).at(-1)?.article;if(!a)process.exit(1);process.stdout.write(a.slug+'.html')")"
          node scripts/verify-media-publication.mjs --article-file="$ARTICLE_FILE"
