name: Deploy SOAM Media strategy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soam-media-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify strategy, publishing, links, and SEO
        run: |
          node scripts/test-media-generation.mjs
          node scripts/test-publish-scheduled-articles.mjs
          node scripts/test-site-links.mjs
          node scripts/test-media-seo.mjs
          node scripts/test-media-strategy.mjs
      - name: Build Cloudflare Pages artifact
        run: node scripts/build-pages-site.mjs
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.105.0 pages deploy dist/site --project-name soam-creative-media --branch main
      - name: Verify custom-domain strategy publication
        run: node scripts/verify-media-strategy-publication.mjs
