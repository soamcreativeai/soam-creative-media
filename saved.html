<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOAM MEDIAで保存した記事を、この端末で読み返せます。">
  <meta name="robots" content="noindex,follow">
  <title>保存した記事｜SOAM MEDIA</title>
  <link rel="stylesheet" href="style.css">
  <script src="articles/article-reader.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><span class="dot"></span>SOAM MEDIA</a>
      <button class="nav-toggle" aria-label="メニュー" onclick="document.getElementById('saved-nav').classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="saved-nav" aria-label="メインナビゲーション">
        <a href="index.html">ホーム</a>
        <a href="articles/index.html">記事一覧</a>
        <a href="editorial-policy.html">編集方針</a>
      </nav>
    </div>
  </header>
  <main class="saved-page">
    <div class="container">
      <p class="saved-eyebrow">READ LATER</p>
      <h1>保存した記事</h1>
      <p class="saved-lead">この端末で「あとで読む」に保存した記事です。端末やブラウザのデータを削除すると、保存内容も消えます。</p>
      <section class="saved-articles" data-saved-articles aria-live="polite"></section>
    </div>
  </main>
</body>
</html>
